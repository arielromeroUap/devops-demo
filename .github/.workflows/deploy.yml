name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Autenticarse en GitHub Container Registry (GHCR)
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Configurar Buildx para compilaciones optimizadas
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Construir y subir la imagen al registro de GitHub
      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devops-demo:latest
            ghcr.io/${{ github.repository_owner }}/devops-demo:${{ github.sha }}